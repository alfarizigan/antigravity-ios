name: Build Antigravity iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Schemes and Targets
        run: |
          xcodebuild -list -project Antigravity.xcodeproj

      - name: Build iOS App (.app)
        run: |
          mkdir -p build/Release-iphoneos
          xcodebuild build \
            -project Antigravity.xcodeproj \
            -scheme Antigravity \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos"

      - name: Package .ipa
        run: |
          APP_PATH=$(find . -name "Antigravity.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Antigravity.app not found!"
            exit 1
          fi
          echo "Packaging $APP_PATH into IPA..."
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q GoogleAntigravity.ipa Payload
          rm -rf Payload
          echo "GoogleAntigravity.ipa created successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleAntigravity-IPA
          path: GoogleAntigravity.ipa
          retention-days: 14
