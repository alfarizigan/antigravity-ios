name: Build Antigravity iOS IPA

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "GoogleAntigravity.ipa"
      - "README.md"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Schemes and Targets
        run: |
          xcodebuild -version
          xcodebuild -list -project Antigravity.xcodeproj

      - name: Build iOS App (.app)
        run: |
          mkdir -p build
          xcodebuild build \
            -project Antigravity.xcodeproj \
            -scheme Antigravity \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1 || (cat build.log && exit 1)

      - name: Package .ipa
        run: |
          APP_PATH=$(find build -name "Antigravity.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Antigravity.app not found in build directory!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Packaging $APP_PATH into IPA..."

          # Copy fallback icons & artworks for ESign / Scarlet / Feather / AltStore compatibility
          cp -f icons/AppIcon*.png "$APP_PATH/"
          cp -f icons/iTunesArtwork* "$APP_PATH/"

          # Strip any residual _CodeSignature directories and enforce Unix 0755 executable permissions
          find "$APP_PATH" -name "_CodeSignature" -type d -exec rm -rf {} + || true
          chmod 755 "$APP_PATH/Antigravity"

          echo "Bundle contents:"
          ls -lh "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Copy iTunesArtwork to IPA root for sideloader preview
          cp -f icons/iTunesArtwork .
          cp -f icons/iTunesArtwork@2x .

          zip -r -9 -q GoogleAntigravity.ipa Payload iTunesArtwork iTunesArtwork@2x
          rm -rf Payload iTunesArtwork iTunesArtwork@2x
          echo "GoogleAntigravity.ipa v2.0.0 successfully packaged!"
          ls -lh GoogleAntigravity.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleAntigravity-IPA
          path: GoogleAntigravity.ipa
          retention-days: 30

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
