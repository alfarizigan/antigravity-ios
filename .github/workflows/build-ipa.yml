name: Build Antigravity iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS App (.app)
        run: |
          mkdir -p build
          xcodebuild clean build \
            -project Antigravity.xcodeproj \
            -scheme Antigravity \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Antigravity.app Payload/
          zip -r -q GoogleAntigravity.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleAntigravity-IPA
          path: GoogleAntigravity.ipa
          retention-days: 14
