name: Build Antigravity iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Schemes and Targets
        run: |
          xcodebuild -list -project Antigravity.xcodeproj

      - name: Build iOS App (.app)
        run: |
          mkdir -p build
          xcodebuild build \
            -project Antigravity.xcodeproj \
            -scheme Antigravity \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1 || (cat build.log && exit 1)

      - name: Package .ipa
        run: |
          APP_PATH=$(find build -name "Antigravity.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Antigravity.app not found in build directory!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Packaging $APP_PATH into IPA..."
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q GoogleAntigravity.ipa Payload
          rm -rf Payload
          echo "GoogleAntigravity.ipa successfully created!"
          ls -lh GoogleAntigravity.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleAntigravity-IPA
          path: GoogleAntigravity.ipa
          retention-days: 14

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
